version: "3.8"

services:
  nginx:
    image: nginx:alpine
    container_name: anti-ddos-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/rate-limit.conf:/etc/nginx/conf.d/rate-limit.conf:ro
      - ./nginx/waf.conf:/etc/nginx/conf.d/waf.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  app:
    build: ./app
    container_name: anti-ddos-app
    expose:
      - "8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RATE_LIMIT_REQUESTS=60
      - RATE_LIMIT_WINDOW=60
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: anti-ddos-redis
    expose:
      - "6379"
    restart: unless-stopped

  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: anti-ddos-crowdsec
    environment:
      - COLLECTIONS=linux,crowdsec/nginx,crowdsec/http-crawl-non_statics,crowdsec/http-bad-user-agent,crowdsec/http-probing,crowdsec/http-backdoors-attempts,crowdsec/http-sensitive-files-attempts,crowdsec/http-vuln-wordpress,crowdsec/http-vuln-generic,crowdsec/http-php-csrf-protection-circumvention
    volumes:
      - ./crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - ./logs/nginx:/var/log/nginx:ro
    depends_on:
      - nginx
    restart: unless-stopped

  fail2ban:
    image: crazymax/fail2ban:latest
    container_name: anti-ddos-fail2ban
    volumes:
      - ./fail2ban/jail.local:/etc/fail2ban/jail.local:ro
      - ./logs/nginx:/var/log/nginx:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: anti-ddos-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./alerts/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command: --config.file=/etc/prometheus/prometheus.yml
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: anti-ddos-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
