user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Log format dengan IP untuk crowdsec
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" $http_x_forwarded_for';

    access_log /var/log/nginx/access.log main;

    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=one:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=2r/s;

    # WAF rules included
    include conf.d/waf.conf;
    include conf.d/rate-limit.conf;

    # Upstream aplikasi
    upstream app {
        server app:8000;
    }

    server {
        listen 80;
        server_name _;

        # Redirect HTTP ke HTTPS (optional)
        # return 301 https://$host$request_uri;

        # Basic security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;

        # Proxy ke aplikasi
        location / {
            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Forward IP ke crowdsec/fail2ban
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Rate limit untuk login
        location /login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://app;
        }

        # Health check endpoint (ga diblokir)
        location /health {
            access_log off;
            allow all;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}