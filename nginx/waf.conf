# WAF rules — blokir pattern serangan umum
# Cek IP bad list dari fail2ban/crowdsec
# Blokir user-agent mencurigakan
if ($http_user_agent ~* (bot|curl|wget|python-requests|python-urllib|sqlmap|nikto|nmap|masscan|acunetix|nessus|openvas|burp)) {
    return 403;
}

# Blokir path traversal / SQLi
if ($request_uri ~* (\.php%00|union%20select|select%20from|drop%20table|insert%20into|delete%20from|../|%00)) {
    return 403;
}

# Blokir query string mencurigakan
if ($args ~* (base64|system|exec|shell|cmd|eval|passthru)) {
    return 403;
}

# Blokir HTTP methods berbahaya
if ($request_method !~ ^(GET|POST|PUT|DELETE|HEAD|OPTIONS|PATCH)$) {
    return 405;
}

# Blokir header suspicious
if ($http_x_forwarded_for ~* (\.|\:\:|\:\:) || $http_user_agent = "") {
    return 403;
}
